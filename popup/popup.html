    </div>
  </div>

  <div class="search-section" style="padding: 0 16px 8px 16px;">
    <input type="text" id="popup-search" class="input" placeholder="Search bookmarks..." style="width: 100%;">
  </div>

  <div class="bookmarks-list" id="bookmarks-container">
